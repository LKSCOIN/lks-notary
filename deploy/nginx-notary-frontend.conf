# Da installare sul server che ESPONE già 80/443 (PROXY_HOST), non sul
# container del notary.
#
#   internet -> 80/443 -> PROXY_HOST nginx -> APP_HOST:8010 uvicorn
#
# In questo modo il sito esistente resta intoccato: si aggiunge soltanto un
# name-based virtual host.

upstream lks_notary {
    server APP_HOST:8010;
    keepalive 8;
}

server {
    listen 80;
    server_name NOTARY_DOMAIN;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name NOTARY_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/NOTARY_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/NOTARY_DOMAIN/privkey.pem;

    # La pagina di verifica calcola l'impronta nel browser: non si caricano file.
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Il limite vale solo sulla scrittura: la verifica resta libera.
    location = /api/v1/notarize {
        limit_req zone=notary_write burst=20 nodelay;
        proxy_pass http://lks_notary;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://lks_notary;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# In http{} di nginx.conf:
# limit_req_zone $binary_remote_addr zone=notary_write:10m rate=10r/m;
