# LKS Notary -- served alongside the existing site.
#
# Two options: a subdomain (shown here) or a /notary/ path on the main site.
# A subdomain is cleaner because the verification page must be reachable
# forever, independently of how the main site evolves.

server {
    listen 80;
    server_name NOTARY_DOMAIN;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name NOTARY_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/NOTARY_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/NOTARY_DOMAIN/privkey.pem;

    # The verification page hashes files in the browser; nothing is uploaded.
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Rate limit the write endpoint only: verification must stay freely usable.
    location = /api/v1/notarize {
        limit_req zone=notary_write burst=20 nodelay;
        proxy_pass http://127.0.0.1:8010;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        include /etc/nginx/proxy_params;
    }
}

# Put this in the http{} block of nginx.conf:
# limit_req_zone $binary_remote_addr zone=notary_write:10m rate=10r/m;
